<div class="min-h-screen bg-neutral-100 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 font-sans antialiased transition-colors">
  
  <!-- Barra Superior Institucional Sóbria com detalhe superior esmeralda -->
  <header class="bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 border-t-4 border-t-[#22863a]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Ícone Minimalista Institucional com link para Home -->
        <a routerLink="/" class="flex items-center gap-3 group">
          <div class="w-6 h-6 rounded bg-[#22863a] group-hover:bg-[#1e7533] flex items-center justify-center text-white shrink-0 shadow-xs transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </div>
          <span class="text-sm font-semibold tracking-tight text-neutral-900 dark:text-white group-hover:text-[#22863a] dark:group-hover:text-emerald-400 transition">
            Consulta Contratações
          </span>
        </a>
        <span class="text-neutral-300 dark:text-neutral-700">|</span>
        <span class="text-xs text-neutral-500 dark:text-neutral-400 hidden sm:inline">
          Adesão a Atas de Registro de Preços Federais (PNCP)
        </span>
      </div>

      <div class="flex items-center gap-3">
        <span class="text-xs text-neutral-500 dark:text-neutral-400 hidden md:block">
          Filtros ativos: Federal · Pregão Eletrônico · Vigente · Permite Adesão
        </span>

        <!-- Botão Alternador Modo Claro / Escuro -->
        <button 
          type="button"
          (click)="themeService.toggleTheme()"
          [title]="themeService.isDarkMode() ? 'Mudar para Modo Claro' : 'Mudar para Modo Escuro'"
          class="px-2.5 py-1.5 text-xs text-neutral-700 dark:text-neutral-200 bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 border border-neutral-300 dark:border-neutral-700 rounded flex items-center gap-1.5 transition cursor-pointer"
        >
          @if (themeService.isDarkMode()) {
            <!-- Ícone Sol -->
            <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <span>Claro</span>
          } @else {
            <!-- Ícone Lua -->
            <svg class="w-3.5 h-3.5 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
            <span>Escuro</span>
          }
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <router-outlet></router-outlet>
  </main>
</div>
