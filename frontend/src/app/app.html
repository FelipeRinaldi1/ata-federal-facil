<div class="min-h-screen bg-neutral-100 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 font-sans antialiased transition-colors">
  
  <!-- Barra Superior Institucional Sóbria com detalhe superior esmeralda -->
  <header class="bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 border-t-4 border-t-[#22863a]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Ícone Minimalista Institucional com link para Home -->
        <a routerLink="/" class="flex items-center gap-2.5 group">
          <!-- Logo SVG Oficial AtaFederalFacil (AFF) -->
          <div class="w-7 h-7 rounded-md bg-[#22863a] group-hover:bg-[#1e7533] flex items-center justify-center text-white shrink-0 shadow-xs transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <!-- Documento / Ata -->
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4h6l4 4v12a2 2 0 01-2 2H8a2 2 0 01-2-2V6a2 2 0 012-2z"></path>
              <!-- Dobra da página -->
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 4v4h4"></path>
              <!-- Lente de Consulta/Mineração integrada -->
              <circle cx="15.5" cy="15.5" r="2.5" stroke-width="2" fill="none"></circle>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.5 17.5L20 20"></path>
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-sm font-bold tracking-tight text-neutral-900 dark:text-white group-hover:text-[#22863a] dark:group-hover:text-emerald-400 transition leading-none">
              AtaFederalFacil
            </span>
            <span class="text-[10px] text-neutral-400 dark:text-neutral-500 font-medium tracking-wide mt-0.5">
              Contratações Federais
            </span>
          </div>
        </a>
        <span class="text-neutral-300 dark:text-neutral-700 hidden sm:inline">|</span>
        <span class="text-xs text-neutral-500 dark:text-neutral-400 hidden sm:inline">
          Localização e Adesão a Atas no PNCP
        </span>
      </div>

      <div class="flex items-center gap-3">
        <!-- Navegação Principal -->
        <nav class="flex items-center gap-1 mr-2">
          <a 
            routerLink="/" 
            routerLinkActive="bg-neutral-100 dark:bg-neutral-800 text-neutral-900 dark:text-white font-semibold" 
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-2.5 py-1 text-xs text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white rounded transition"
          >
            Editais
          </a>
          <a 
            routerLink="/busca-profunda" 
            routerLinkActive="bg-neutral-100 dark:bg-neutral-800 text-neutral-900 dark:text-white font-semibold" 
            class="px-2.5 py-1 text-xs text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white rounded transition"
          >
            Buscar Itens
          </a>
        </nav>

        <span class="text-xs text-neutral-500 dark:text-neutral-400 hidden lg:block">
          Filtros: Federal · Pregão · Vigente · Carona
        </span>

        <!-- Botão Alternador Modo Claro / Escuro -->
        <button 
          type="button"
          (click)="themeService.toggleTheme()"
          [title]="themeService.isDarkMode() ? 'Mudar para Modo Claro' : 'Mudar para Modo Escuro'"
          class="px-2.5 py-1.5 text-xs font-medium text-neutral-700 dark:text-neutral-200 bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 border border-neutral-300 dark:border-neutral-700 rounded flex items-center gap-1.5 transition active:scale-[0.98] cursor-pointer"
        >
          @if (themeService.isDarkMode()) {
            <!-- Ícone Sol SVG com traço regular monocromático -->
            <svg class="w-3.5 h-3.5 text-neutral-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <span>Modo Claro</span>
          } @else {
            <!-- Ícone Lua SVG com traço regular monocromático -->
            <svg class="w-3.5 h-3.5 text-neutral-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
            <span>Modo Escuro</span>
          }
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <router-outlet></router-outlet>
  </main>
</div>
